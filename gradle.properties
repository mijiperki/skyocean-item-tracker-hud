org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
kotlin.code.style=official

# Mod
modVersion=0.1.0
mavenGroup=dev.tperkins.multicraft
archivesBaseName=multicraft-helper

# Minecraft / toolchain
# Built against 1.21.11 (Java 21) because it has official Mojang mappings and a
# published Fabric API. MC 26.1.2 has NO public obfuscation mappings yet (Mojang's
# release JSON ships only client/server jars; Fabric has no Yarn for 26.x), so a
# stock Loom workspace can't target it. 26.x is a future Stonecutter target once
# community mappings are available — see DESIGN.md / README "Build status".
minecraftVersion=1.21.11
fabricLoaderVersion=0.18.3
fabricApiVersion=0.141.6+1.21.11
fabricLanguageKotlinVersion=1.13.12+kotlin.2.4.0
