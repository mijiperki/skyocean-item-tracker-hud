org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
kotlin.code.style=official

# loom-back-compat: 26.1.2 is deobfuscated, so use the unobfuscated Loom variant
# (plain fabric-loom, no remapping). 1.15-SNAPSHOT resolves to Loom 1.15.5.
loomx.unobfuscated=true
loomx.loom_version=1.15-SNAPSHOT

# Mod
modVersion=0.1.0
mavenGroup=dev.tperkins.multicraft
archivesBaseName=multicraft-helper

# Minecraft / toolchain
# Built against Minecraft 26.1.2, which Mojang ships DEOBFUSCATED (real class
# names, no obfuscation/intermediary layer) for 26.1+. That's why no Mojang
# mappings or Yarn exist for it and none are needed: Loom skips remapping and mod
# deps are plain (not `mod`-prefixed) configurations. Requires Java 25.
# Versions match the user's runtime (Skyblock Enhanced pack) so the jar is
# binary-compatible in-game.
minecraftVersion=26.1.2
fabricLoaderVersion=0.19.3
fabricApiVersion=0.155.2+26.1.2
fabricLanguageKotlinVersion=1.13.13+kotlin.2.4.10
